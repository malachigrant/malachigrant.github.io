<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Dog Sitting Down</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: linear-gradient(180deg, #eaf6ff 0%, #d3ecff 60%, #bfe3c9 100%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #2b4a63;
  }

  h1 { font-size: 26px; font-weight: 600; letter-spacing: 0.5px; }

  .stage {
    position: relative;
    width: 360px;
    height: 400px;
  }

  .dog {
    position: absolute;
    inset: 0;
  }

  /* ---------- ground shadow ---------- */
  .shadow {
    position: absolute;
    bottom: 6px;
    left: 60px;
    width: 240px;
    height: 34px;
    background: rgba(40, 60, 40, 0.14);
    border-radius: 50%;
  }

  /* ---------- body (sitting haunch) ---------- */
  .body {
    position: absolute;
    bottom: 20px;
    left: 70px;
    width: 220px;
    height: 200px;
    background: #b5824f;
    border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%;
  }

  /* lighter chest on the front */
  .chest {
    position: absolute;
    bottom: 20px;
    left: 96px;
    width: 120px;
    height: 170px;
    background: #d9b98c;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
  }

  /* ---------- front legs ---------- */
  .leg {
    position: absolute;
    bottom: 20px;
    width: 36px;
    height: 128px;
    background: #c99a63;
    border-radius: 18px 18px 14px 14px;
  }
  .leg.left  { left: 118px; }
  .leg.right { left: 168px; }

  /* rounded paws at the bottom of each leg */
  .leg::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: -8px;
    width: 52px;
    height: 26px;
    background: #d9b98c;
    border-radius: 50%;
  }

  /* ---------- tail ---------- */
  .tail {
    position: absolute;
    bottom: 96px;
    right: 52px;
    width: 30px;
    height: 84px;
    background: #8a5a2e;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin: bottom center;
    animation: wag 1.2s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(14deg); }
    50%      { transform: rotate(34deg); }
  }

  /* ---------- head ---------- */
  .head {
    position: absolute;
    top: 40px;
    left: 110px;
    width: 140px;
    height: 140px;
    background: #b5824f;
    border-radius: 50% 50% 48% 48%;
  }

  /* floppy ears */
  .ear {
    position: absolute;
    width: 46px;
    height: 76px;
    background: #8a5a2e;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .ear.left  { top: -12px; left: 2px;  transform: rotate(-18deg); }
  .ear.right { top: -12px; right: 2px; transform: rotate(18deg); }

  /* eyes */
  .eye {
    position: absolute;
    top: 56px;
    width: 16px;
    height: 18px;
    background: #2a1a0a;
    border-radius: 50%;
  }
  .eye.left  { left: 42px; }
  .eye.right { left: 86px; }
  .eye::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
  }

  /* muzzle */
  .muzzle {
    position: absolute;
    bottom: 12px;
    left: 38px;
    width: 66px;
    height: 48px;
    background: #d9b98c;
    border-radius: 50%;
  }
  .nose {
    position: absolute;
    top: 4px;
    left: 23px;
    width: 20px;
    height: 14px;
    background: #3a2a1a;
    border-radius: 50%;
  }
  .tongue {
    position: absolute;
    top: 20px;
    left: 28px;
    width: 14px;
    height: 20px;
    background: #e8837e;
    border-radius: 0 0 50% 50%;
  }

  .caption { font-size: 15px; opacity: 0.75; }
</style>
</head>
<body>
  <h1>A CSS Dog, Sitting Down</h1>

  <div class="stage">
    <div class="dog">
      <div class="shadow"></div>
      <div class="tail"></div>
      <div class="body"></div>
      <div class="chest"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="muzzle">
          <div class="nose"></div>
          <div class="tongue"></div>
        </div>
      </div>
    </div>
  </div>

  <p class="caption">Built entirely with CSS shapes &mdash; no images.</p>
</body>
</html>
